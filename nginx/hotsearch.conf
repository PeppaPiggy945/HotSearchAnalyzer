# 热点信息搜集系统 - Nginx配置
# 用法：
# 1. 复制此文件到 /etc/nginx/sites-available/hotsearch
# 2. 创建符号链接: sudo ln -s /etc/nginx/sites-available/hotsearch /etc/nginx/sites-enabled/
# 3. 修改 server_name 为你的域名
# 4. 测试配置: sudo nginx -t
# 5. 重载Nginx: sudo systemctl reload nginx

upstream hotsearch_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # 修改为你的域名或IP地址
    server_name your-domain.com;

    # 字符集
    charset utf-8;

    # 客户端上传大小限制
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # 访问日志
    access_log /var/log/nginx/hotsearch_access.log;
    error_log /var/log/nginx/hotsearch_error.log;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_comp_level 6;
    gzip_disable "msie6";

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 反向代理API请求
    location / {
        proxy_pass http://hotsearch_backend;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API健康检查
    location /api/health {
        proxy_pass http://hotsearch_backend/api/health;
        proxy_http_version 1.1;
        access_log off;  # 不记录健康检查日志
    }

    # 静态文件（如果有）
    location /static {
        alias /opt/hotsearch/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 日志文件访问（可选）
    location /logs {
        alias /opt/hotsearch/logs;
        autoindex off;
        # 生产环境建议注释掉，或添加IP白名单
        # allow 127.0.0.1;
        # deny all;
    }

    # 输出文件访问（可选）
    location /outputs {
        alias /opt/hotsearch/outputs;
        autoindex off;
        expires 1h;
    }

    # 限制请求频率（可选）
    location /api/ {
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://hotsearch_backend;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问敏感文件
    location ~ /(\.git|\.env|\.htaccess|\.passwd|config/user_config\.yaml) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

