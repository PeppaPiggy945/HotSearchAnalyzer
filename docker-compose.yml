  #     - hotsearch-network

  # 可选：Nginx反向代理
  # nginx:
  #   image: nginx:alpine
  #   container_name: hotsearch-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/hotsearch.conf:/etc/nginx/conf.d/default.conf
